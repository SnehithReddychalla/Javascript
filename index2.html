<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Student Management System</title>
</head>
<body>

    <h1>Student Management System</h1>

    <h3>Add or Edit Student</h3>

    <form id="studentForm">
        <input type="hidden" id="studentId">

        <label>Name:</label>
        <input type="text" id="name" required>

        <label>Age:</label>
        <input type="number" id="age" min="1" required>

        <label>Course:</label>
        <input type="text" id="course" required>

        <label>Marks:</label>
        <input type="number" id="marks" min="0" max="100" required>

        <button type="submit">Save Student</button>
        <button type="button" id="resetButton">Clear Form</button>
    </form>

    <hr>

    <h3>Search and Filter</h3>

    <input type="text" id="searchInput"
           placeholder="Search by name or course">

    <select id="filterCourse">
        <option value="all">All Courses</option>
        <option value="JavaScript">JavaScript</option>
        <option value="HTML">HTML</option>
        <option value="Python">Python</option>
    </select>

    <select id="sortBy">
        <option value="name">Sort by Name</option>
        <option value="marks">Sort by Marks</option>
        <option value="age">Sort by Age</option>
    </select>

    <button id="loadApiButton">Load API Students</button>
    <button id="clearStudentsButton">Delete All Students</button>

    <p id="status"></p>
    <p id="summary"></p>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Result</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>

    <script type="module">

        // 1. VARIABLES AND DATA TYPES
        const appName = "Student Management System";
        let nextId = 4;
        let students = [];
        let requestController = null;

        console.log(appName);
        console.log(typeof appName);
        console.log(typeof nextId);
        console.log(typeof true);

        // 2. OPERATORS
        const calculatePercentage = (marks) => (marks / 100) * 100;

        // 3. CONDITIONAL STATEMENTS
        function getResult(marks) {
            if (marks >= 75) {
                return "Distinction";
            } else if (marks >= 35) {
                return "Pass";
            } else {
                return "Fail";
            }
        }

        // 4. LOOPS
        function calculateTotalMarks(list) {
            let total = 0;

            for (let i = 0; i < list.length; i++) {
                total += list[i].marks;
            }

            return total;
        }

        // 5. FUNCTIONS
        function validateStudent(name, age, course, marks) {
            if (!name.trim()) {
                throw new Error("Name cannot be empty.");
            }

            if (!Number.isFinite(age) || age < 1 || age > 100) {
                throw new Error("Enter a valid age.");
            }

            if (!course.trim()) {
                throw new Error("Course cannot be empty.");
            }

            if (!Number.isFinite(marks) || marks < 0 || marks > 100) {
                throw new Error("Marks must be between 0 and 100.");
            }

            return true;
        }

        // 6. CALLBACK FUNCTIONS
        function showMessage(message, callback) {
            document.getElementById("status").textContent = message;
            callback();
        }

        // 7. HIGHER ORDER FUNCTIONS
        // A higher-order function accepts or returns another function.
        function processStudents(list, callback) {
            return list.map(callback);
        }

        // 8. SCOPE AND CLOSURES
        function createIdGenerator(startValue) {
            let id = startValue;

            return function () {
                return id++;
            };
        }

        const generateId = createIdGenerator(1);

        // 9. ARRAYS
        students = [
            {
                id: generateId(),
                name: "Snehith",
                age: 22,
                course: "JavaScript",
                marks: 85
            },
            {
                id: generateId(),
                name: "Sai",
                age: 21,
                course: "HTML",
                marks: 68
            },
            {
                id: generateId(),
                name: "Kumar",
                age: 23,
                course: "Python",
                marks: 90
            }
        ];

        nextId = 4;

        // 10. ARRAY METHODS
        // map(), filter(), find(), reduce(), forEach(), sort()

        const averageMarks = (list) => {
            if (list.length === 0) return 0;

            return list.reduce((total, student) =>
                total + student.marks, 0) / list.length;
        };

        // 11. OBJECTS AND 12. OBJECT MANIPULATION
        const createStudent = (id, name, age, course, marks) => ({
            id,
            name,
            age,
            course,
            marks,
            active: true
        });

        // 13. DESTRUCTURING
        function logStudent({ name, course, marks }) {
            console.log('Student: ${name}, Course: ${course}, Marks: ${marks}');
        }

        // 14. SPREAD AND REST
        function updateStudent(id, ...updatedFields) {
            const [name, age, course, marks] = updatedFields;

            students = students.map(student =>
                student.id === id
                    ? { ...student, name, age, course, marks }
                    : student
            );

            saveLocalStorage();
            renderStudents();
        }

        // 15. DOM MANIPULATION
        const table = document.getElementById("studentTable");
        const searchInput = document.getElementById("searchInput");
        const filterCourse = document.getElementById("filterCourse");
        const sortBy = document.getElementById("sortBy");
        const form = document.getElementById("studentForm");

        // 16. EVENT HANDLING
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            try {
                const id = document.getElementById("studentId").value;
                const name = document.getElementById("name").value.trim();
                const age = Number(document.getElementById("age").value);
                const course = document.getElementById("course").value.trim();
                const marks = Number(document.getElementById("marks").value);

                validateStudent(name, age, course, marks);

                if (id) {
                    updateStudent(Number(id), name, age, course, marks);
                    showMessage("Student updated successfully!", () => {});
                } else {
                    const student = createStudent(
                        nextId++, name, age, course, marks
                    );

                    students.push(student);
                    saveLocalStorage();
                    renderStudents();

                    showMessage("Student added successfully!", () => {});
                }

                form.reset();
                document.getElementById("studentId").value = "";

            } catch (error) {
                showMessage(error.message, () => console.error(error));
            }
        });

        // 17. EVENT DELEGATION
        // One listener handles Edit and Delete for all table rows.
        table.addEventListener("click", function (event) {
            const button = event.target.closest("button");

            if (!button) return;

            const id = Number(button.dataset.id);
            const student = students.find(item => item.id === id);

            if (!student) return;

            if (button.dataset.action === "edit") {
                document.getElementById("studentId").value = student.id;
                document.getElementById("name").value = student.name;
                document.getElementById("age").value = student.age;
                document.getElementById("course").value = student.course;
                document.getElementById("marks").value = student.marks;

            } else if (button.dataset.action === "delete") {
                students = students.filter(item => item.id !== id);
                saveLocalStorage();
                renderStudents();
                showMessage("Student deleted.", () => {});
            }
        });

        // 18. LOCAL STORAGE
        function saveLocalStorage() {
            localStorage.setItem("students", JSON.stringify(students));
        }

        function loadLocalStorage() {
            try {
                const saved = localStorage.getItem("students");

                if (saved === null) return;

                const parsed = JSON.parse(saved);

                if (!Array.isArray(parsed)) {
                    throw new Error("Saved student data is invalid.");
                }

                students = parsed;
                nextId = Math.max(0, ...students.map(s => s.id)) + 1;

            } catch (error) {
                console.error("Could not load saved students:", error);
                showMessage("Saved data could not be loaded.", () => {});
            }
        }

        // 19. SESSION STORAGE
        // Search text is remembered only for this browser tab session.
        function saveSessionSearch() {
            sessionStorage.setItem("studentSearch", searchInput.value);
        }

        searchInput.addEventListener("input", function () {
            saveSessionSearch();
            renderStudents();
        });

        // 20. PROMISES
        function getLocalStudents() {
            return new Promise((resolve) => {
                resolve(students);
            });
        }

        getLocalStudents()
            .then(list => console.log("Loaded students:", list.length))
            .catch(error => console.error(error))
            .finally(() => console.log("Local loading completed."));

        // 21. ASYNC/AWAIT
        // 22. ERROR HANDLING
        // 23. API INTEGRATION
        async function loadApiStudents() {
            const status = document.getElementById("status");

            if (requestController) {
                requestController.abort();
            }

            requestController = new AbortController();

            try {
                status.textContent = "Loading API data...";

                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users",
                    { signal: requestController.signal }
                );

                if (!response.ok) {
                    throw new Error('HTTP error: ${response.status}');
                }

                const data = await response.json();

                // Convert API objects into our student format.
                const apiStudents = data.map(user => ({
                    id: nextId++,
                    name: user.name,
                    age: 18 + (user.id % 10),
                    course: user.id % 2 === 0 ? "JavaScript" : "HTML",
                    marks: 40 + (user.id * 5),
                    email: user.email
                }));

                students = [...students, ...apiStudents];

                saveLocalStorage();
                renderStudents();

                status.textContent = '${apiStudents.length} API students loaded.';

            } catch (error) {
                if (error.name === "AbortError") return;

                console.error("API error:", error);
                status.textContent = "Unable to load API data. Check your internet connection.";
            } finally {
                requestController = null;
            }
        }

        document.getElementById("loadApiButton")
            .addEventListener("click", loadApiStudents);

        // 24. SEARCH AND FILTER
        function getFilteredStudents() {
            const searchText = searchInput.value.toLowerCase().trim();
            const selectedCourse = filterCourse.value;

            return students
                .filter(student =>
                    student.name.toLowerCase().includes(searchText) ||
                    student.course.toLowerCase().includes(searchText)
                )
                .filter(student =>
                    selectedCourse === "all" ||
                    student.course === selectedCourse
                )
                .sort((a, b) => {
                    if (sortBy.value === "marks") {
                        return b.marks - a.marks;
                    }

                    if (sortBy.value === "age") {
                        return a.age - b.age;
                    }

                    return a.name.localeCompare(b.name);
                });
        }

        filterCourse.addEventListener("change", renderStudents);
        sortBy.addEventListener("change", renderStudents);

        // 25. JAVASCRIPT MODULES
        // This file uses <script type="module">.
        // All functions are inside this module's scope.
        // import/export between files requires separate JS files.

        // RENDER STUDENTS
        function renderStudents() {
            table.replaceChildren();

            const visibleStudents = getFilteredStudents();

            // Callback + higher-order function + destructuring.
            const rows = processStudents(visibleStudents, student => {
                const { id, name, age, course, marks } = student;

                const row = document.createElement("tr");

                const values = [
                    id, name, age, course, marks, getResult(marks)
                ];

                values.forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actions = document.createElement("td");

                actions.innerHTML = `
                    <button data-action="edit" data-id="${id}">Edit</button>
                    <button data-action="delete" data-id="${id}">Delete</button>
                `;

                row.appendChild(actions);

                return row;
            });

            rows.forEach(row => table.appendChild(row));

            const total = calculateTotalMarks(visibleStudents);
            const average = averageMarks(visibleStudents);

            document.getElementById("summary").textContent =
                `Showing ${visibleStudents.length} students | ` +
                'Total Marks: ${total} | Average: ${average.toFixed(2)}%';
        }

        // CLEAR FORM
        document.getElementById("resetButton")
            .addEventListener("click", () => {
                form.reset();
                document.getElementById("studentId").value = "";
            });

        // DELETE ALL
        document.getElementById("clearStudentsButton")
            .addEventListener("click", () => {
                if (!confirm("Delete all students?")) return;

                students = [];
                saveLocalStorage();
                renderStudents();

                showMessage("All students deleted.", () => {});
            });

        // START APPLICATION
        loadLocalStorage();

        if (sessionStorage.getItem("studentSearch")) {
            searchInput.value = sessionStorage.getItem("studentSearch");
        }

        renderStudents();

        // Example use of destructuring and percentage calculation.
        if (students.length > 0) {
            logStudent(students[0]);
            console.log(calculatePercentage(students[0].marks));
        }

    </script>
</body>
</html>
