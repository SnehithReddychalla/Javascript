<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>1.flexbox order</h2>
    <div class="container">
        <div class="box html">HTML</div>
        <div class="box css">CSS</div>
        <div class="box javascript">Javascript</div>

    </div>
    <h2>2. flex Grow , shrink,and basics</h2>
    
    <div class="flex-container">
        <div class="item item1" >Item 1</div>
        <div class="item item2" >Item 2</div>
        <div class="item item3" >Item 3</div>

    </div>
   <div class="grid-container">
    <div class="grid-item">HTML</div>
    <div class="grid-item" >CSS</div>
    <div class="grid-item" >Javascript</div>
    <div class="grid-item" >React</div>


   </div>
</body>
</html>
