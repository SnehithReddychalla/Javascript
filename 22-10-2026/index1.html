<!DOCTYPE html>
<html>
<head>
    <title>CSS Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        /* 1. Gradients */
        .gradient {
            padding: 30px;
            color: white;
            background: linear-gradient(to right, blue, purple);
            border-radius: 10px;
            margin: 20px;
        }

        /* 2. Box Shadow */
        .box-shadow {
            background: white;
            padding: 30px;
            margin: 20px;
            box-shadow: 5px 5px 15px gray;
            border-radius: 10px;
        }

        /* 3. Text Shadow */
        .text-shadow {
            color: darkblue;
            text-shadow: 3px 3px 4px gray;
        }

        /* 4. Opacity */
        .opacity {
            background: orange;
            padding: 30px;
            margin: 20px;
            opacity: 0.5;
            border-radius: 10px;
        }

        /* 5. Transition */
        .transition {
            background: green;
            color: white;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;

            transition: background 0.5s, transform 0.5s;
        }

        .transition:hover {
            background: red;
            transform: scale(1.1);
        }

        /* 6. Transform */
        .transform {
            background: purple;
            color: white;
            padding: 25px;
            margin: 40px auto;
            width: 150px;
            border-radius: 10px;

            transform: rotate(-5deg);
        }
    </style>
</head>

<body>

    <h1>CSS Effects</h1>

    <h2>1. Gradients</h2>
    <div class="gradient">
        Linear Gradient Background
    </div>

    <h2>2. Box Shadows</h2>
    <div class="box-shadow">
        This box has a shadow
    </div>

    <h2>3. Text Shadows</h2>
    <h1 class="text-shadow">
        Welcome to CSS
    </h1>

    <h2>4. Opacity</h2>
    <div class="opacity">
        This box has 50% opacity
    </div>

    <h2>5. Transitions</h2>
    <div class="transition">
        Move your mouse over me
    </div>

    <h2>6. Transforms</h2>
    <div class="transform">
        Rotated Box
    </div>

</body>
</html>
